name: Build

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: sm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.19.0

    - name: Install dependencies
      run: flutter pub get
  
    - name: Build Flutter app
      run: flutter build bundle

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: flutter_assets
        path: ./build/flutter_assets/
        retention-days: 3
